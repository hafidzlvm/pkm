<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Film Strip Icon -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#grad1)"/>
  
  <!-- Film Strip Holes -->
  <circle cx="100" cy="100" r="25" fill="#ffffff" opacity="0.3"/>
  <circle cx="100" cy="412" r="25" fill="#ffffff" opacity="0.3"/>
  <circle cx="412" cy="100" r="25" fill="#ffffff" opacity="0.3"/>
  <circle cx="412" cy="412" r="25" fill="#ffffff" opacity="0.3"/>
  
  <!-- Film Strip Frame -->
  <rect x="150" y="150" width="212" height="212" rx="15" fill="none" stroke="#ffffff" stroke-width="12"/>
  
  <!-- Play Icon -->
  <path d="M 200 220 L 200 292 L 272 256 Z" fill="#ffffff"/>
  
  <!-- Film Strip Perforations -->
  <rect x="140" y="180" width="8" height="20" rx="2" fill="#ffffff" opacity="0.5"/>
  <rect x="140" y="220" width="8" height="20" rx="2" fill="#ffffff" opacity="0.5"/>
  <rect x="140" y="260" width="8" height="20" rx="2" fill="#ffffff" opacity="0.5"/>
  <rect x="140" y="300" width="8" height="20" rx="2" fill="#ffffff" opacity="0.5"/>
  
  <rect x="364" y="180" width="8" height="20" rx="2" fill="#ffffff" opacity="0.5"/>
  <rect x="364" y="220" width="8" height="20" rx="2" fill="#ffffff" opacity="0.5"/>
  <rect x="364" y="260" width="8" height="20" rx="2" fill="#ffffff" opacity="0.5"/>
  <rect x="364" y="300" width="8" height="20" rx="2" fill="#ffffff" opacity="0.5"/>
</svg>

