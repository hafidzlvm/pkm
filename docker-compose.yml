services:
  pkm-panti-nginx:
    image: nginx:alpine
    container_name: pkm-panti-nginx
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=${PKM_DOMAIN}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${PKM_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - CORS_ALLOWED_DOMAIN=${CORS_ALLOWED_DOMAIN}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - pkm-panti-app
    networks:
      - solusi-digital-khatulistiwa

  pkm-panti-app:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: pkm-panti-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD", "bun", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - solusi-digital-khatulistiwa
    labels:
      - "com.docker.compose.project=pkm-panti"
      - "com.docker.compose.service=pkm-panti"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

networks:
  solusi-digital-khatulistiwa:
    external: true
