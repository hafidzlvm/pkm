upstream hafidzlvm-pokedex-app {
    server hafidzlvm-pokedex-app:3000;
}

# 1. Ambil whitelist yang dikirim dari Nginx Proxy Depan
#    Header: X-CORS-Allowed-Domain
map $http_x_cors_allowed_domain $CORS_ALLOWED_DOMAIN {
    # Jika Proxy Depan tidak kirim apa-apa (misal diakses langsung tanpa proxy), block atau allow * (tergantung kebijakan).
    # Disini kita set default "" agar aman.
    default $http_x_cors_allowed_domain; 
}

server {
    listen 80;
    server_name _;
    client_max_body_size 2048m;

    # Timeouts
    proxy_connect_timeout 900;
    proxy_send_timeout 900;
    proxy_read_timeout 900;
    send_timeout 900;

    location / {
        proxy_pass http://hafidzlvm-pokedex-app;
        
        # Standard Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websocket Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # === CORS CONFIGURATION ===
        # Menggunakan value yang sudah diverifikasi oleh Nginx Proxy Depan
        
        # Jika $CORS_ALLOWED_DOMAIN kosong (berarti tidak di whitelist), header ini tidak akan dikirim (Browser nge-blok).
        add_header 'Access-Control-Allow-Origin' $CORS_ALLOWED_DOMAIN always;
        
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Preflight Request (OPTIONS)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $CORS_ALLOWED_DOMAIN always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
}
